<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Nicolas Boivin — Cybersecurity Engineer, Network &amp; Systems Administrator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="1020" cy="40" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="120" cy="400" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
      .in { animation: in .7s ease-out both; }
      .l1 { animation-delay: .3s; } .l2 { animation-delay: .6s; } .l3 { animation-delay: .9s; }
      .l4 { animation-delay: 1.2s; } .l5 { animation-delay: 1.5s; } .l6 { animation-delay: 1.8s; } .l7 { animation-delay: 2.1s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect width="1200" height="380" fill="url(#glow1)"/>
    <rect width="1200" height="380" fill="url(#glow2)"/>
    <rect width="1200" height="2" fill="url(#topline)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="19.5" fill="none" stroke="#1f2937"/>

  <!-- Left: identity -->
  <g class="in">
    <text x="64" y="100" class="mono" font-size="16" fill="#64748b"><tspan fill="#34d399">nicolas@boivin-sec</tspan>:<tspan fill="#60a5fa">~</tspan>$ ./intro.sh</text>
    <text x="62" y="170" class="sans" font-size="60" font-weight="700" fill="#f8fafc" letter-spacing="-1">Nicolas Boivin</text>
    <text x="64" y="214" class="sans" font-size="24" font-weight="600" fill="url(#accent)">Cybersecurity Engineer</text>
    <text x="64" y="248" class="sans" font-size="20" fill="#94a3b8">Network &amp; Systems Administrator</text>
  </g>

  <g class="in l2 mono" font-size="14">
    <rect x="64" y="286" width="141" height="32" rx="16" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="134.5" y="307" text-anchor="middle" fill="#cbd5e1">Paris, France</text>
    <rect x="217" y="286" width="217" height="32" rx="16" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="325.5" y="307" text-anchor="middle" fill="#cbd5e1">Enterprise IT Security</text>
    <rect x="446" y="286" width="166" height="32" rx="16" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="529" y="307" text-anchor="middle" fill="#cbd5e1">CISM in progress</text>
  </g>

  <!-- Right: terminal -->
  <g class="in l1">
    <rect x="700" y="60" width="436" height="260" rx="12" fill="#020617" fill-opacity="0.85" stroke="#1e293b"/>
    <path d="M700 96 H1136" stroke="#1e293b"/>
    <circle cx="722" cy="78" r="6" fill="#f87171"/>
    <circle cx="742" cy="78" r="6" fill="#fbbf24"/>
    <circle cx="762" cy="78" r="6" fill="#34d399"/>
    <text x="918" y="83" text-anchor="middle" class="mono" font-size="13" fill="#64748b">zsh — boivin-sec</text>
  </g>

  <g class="mono" font-size="15">
    <text x="724" y="132" class="in l2" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> whoami</text>
    <text x="724" y="160" class="in l3" fill="#94a3b8">nicolas.boivin</text>
    <text x="724" y="188" class="in l4" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> cat focus.txt</text>
    <text x="724" y="216" class="in l5" fill="#22d3ee">pentest · netsec · dfir · siem</text>
    <text x="724" y="244" class="in l6" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> cert --status</text>
    <text x="724" y="272" class="in l7" fill="#a78bfa">CISM ▸ in progress</text>
    <text x="724" y="300" fill="#34d399">$</text>
    <rect x="742" y="287" width="9" height="17" fill="#e2e8f0" class="cursor"/>
  </g>
</svg>
