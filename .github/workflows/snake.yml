name: Generate contribution snake

on:
  # Manual only for now: GitHub Actions is blocked on this account (billing issue).
  # Once resolved, restore the daily schedule:
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#164e63,#0e7490,#06b6d4,#a78bfa
            dist/snake-light.svg?palette=github-light&color_snake=#0891b2&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0891b2,#7c3aed

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
